[project]
name = "stac-fastapi-globus-search"
version = "1.0.0"
description = "A STAC API backed by Globus Search, exposing ESGF climate datasets as STAC Collections and Items."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/stac_fastapi/globus_search"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
